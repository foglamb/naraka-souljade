# =============================================================================
# 纯静态站 · GitHub Pages 自动部署
# -----------------------------------------------------------------------------
# 触发：push 到 main（或手动 workflow_dispatch）
# 做法：把「站点文件」推到 gh-pages 分支，Pages 已绑定该分支 → 自动重建
# 产物：https://<user>.github.io/<repo>/
#
# 为什么不用 actions/deploy-pages：
#   那条路要求 workflow 自己创建 Pages 站点（POST /repos/:r/pages），
#   GITHUB_TOKEN 需要额外授权；fine-grained PAT 也常缺 pages 权限。
#   推 gh-pages 分支只要 contents:write，最稳。
# =============================================================================
name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanity check
        run: |
          set -e
          test -f index.html                       || { echo "::error::index.html 缺失"; exit 1; }
          for f in app.js data.js styles.css; do
            test -f "$f" || { echo "::error::$f 缺失"; exit 1; }
          done
          for f in ext/nsj-ext-core.js ext/nsj-ext-store.js ext/nsj-ext-optimizer.js ext/nsj-ext-ui.js ext/nsj-ext.css; do
            test -f "$f" || { echo "::error::二改扩展缺失 $f"; exit 1; }
          done
          echo "静态文件清单："
          ls -1 *.html *.js *.css ext/* | sed 's/^/  /'

      - name: Assemble site (只挑站点需要的文件)
        run: |
          set -e
          rm -rf _site && mkdir -p _site
          cp index.html app.js data.js styles.css _site/
          cp -r assets ext _site/
          touch _site/.nojekyll
          du -sh _site
          find _site -type f | wc -l

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: false
          commit_message: "deploy: ${{ github.sha }}"
