<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<title>永劫无间 · 征神之路 魂玉配装器</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="ext/nsj-ext.css">
<link rel="stylesheet" href="ext/nsj-layout.css">
<link rel="stylesheet" href="ext/nsj-auto-analysis.css">
<script>
  /* 首屏渲染前先套用已保存的主题色，避免闪一下默认蓝 */
  (function () {
    try {
      var t = JSON.parse(localStorage.getItem('naraka-souljade-theme') || 'null');
      if (!t || !t.a) return;
      var s = document.documentElement.style;
      s.setProperty('--accent-rgb', t.a);
      s.setProperty('--accent-rgb-2', t.b || t.a);
      if (t.t) s.setProperty('--accent-text', t.t);
    } catch (e) { /* 忽略 */ }
  })();
</script>
</head>
<body data-tab="pool">

<!-- ==================== 顶栏：一行 ==================== -->
<header class="topbar">
  <div class="brand">
    <div class="logo">魂</div>
    <div class="brand-text">
      <h1>征神之路 · 魂玉配装器</h1>
      <p class="sub">永劫无间</p>
    </div>
  </div>
  <div class="topbar-actions">
    <div class="menu-wrap" id="themeWrap">
      <button class="btn btn-theme" id="btnTheme" type="button" title="切换界面主色调">
        <span class="theme-dot" id="themeDot"></span>主题
      </button>
      <div class="theme-panel" id="themePanel">
        <div class="theme-title">界面主色调</div>
        <div class="theme-wheel" id="themeWheel" title="点击 / 拖动取色">
          <span class="theme-cursor" id="themeCursor"></span>
        </div>
        <label class="theme-slider">
          <span>明度</span>
          <input type="range" id="themeLight" min="52" max="94" step="1" value="79">
          <b id="themeLightVal">79</b>
        </label>
        <div class="theme-swatches" id="themeSwatches"></div>
        <div class="theme-preview">
          <span class="tp-accent"></span>
          <button type="button" class="tp-btn">按钮</button>
          <span class="tp-tag">标签</span>
        </div>
        <div class="theme-actions">
          <button type="button" class="btn" id="themeReset">恢复默认</button>
          <button type="button" class="btn btn-primary" id="themeApply">应用</button>
        </div>
      </div>
    </div>
    <div class="menu-wrap">
      <button class="btn" id="btnPreset" type="button">推荐 ▾</button>
      <div class="menu" id="presetMenu"></div>
    </div>
    <button class="btn" id="btnSave" type="button" title="给当前配装起名并保存">保存</button>
    <div class="menu-wrap">
      <button class="btn" id="btnBuilds" type="button">存档<span class="cnt" id="buildCount">0</span></button>
      <div class="menu" id="buildMenu"></div>
    </div>
    <div class="more-wrap">
      <button class="btn" id="btnMore" type="button" title="更多">⋯</button>
      <div class="more-menu" id="moreMenu">
        <button type="button" id="btnExport">导出 / 分享</button>
        <button type="button" id="btnImport">导入</button>
        <hr>
        <button type="button" class="danger" id="btnClear">清空配装</button>
      </div>
    </div>
  </div>
</header>

<!-- ==================== 工作标签 ==================== -->
<nav class="worktabs" id="worktabs">
  <button class="worktab active" data-view="build" type="button">① 配置<span class="badge" id="tabBuildBadge">0</span></button>
  <button class="worktab" data-view="result" type="button">② 结果</button>
  <button class="worktab" data-view="compare" type="button">③ 对比 · 最优<span class="badge" id="tabExtBadge">0</span></button>
  <span class="worktab-spacer"></span>
  <span class="worktab-hint" id="worktabHint">点左侧魂玉 → 中间槽位</span>
</nav>

<!-- ==================== 工作区 ==================== -->
<main class="workspace">

  <!-- ---------- 视图 ①：配置 ---------- -->
  <section class="view view-build active" id="view-build">

    <!-- 左：魂玉池 -->
    <div class="pane">
      <div class="pane-head">
        <h2>魂玉池</h2>
        <span class="hint" id="poolCount"></span>
      </div>
      <div class="pool-tools">
        <div class="search-wrap">
          <span class="search-icon">⌕</span>
          <input id="searchInput" type="search" placeholder="搜索魂玉…" autocomplete="off">
        </div>
        <div class="chips" id="filterChips"></div>
      </div>
      <div class="pane-body">
        <div class="pool-list" id="poolList"></div>
      </div>
    </div>

    <!-- 中：槽位 -->
    <div class="pane">
      <div class="pane-head">
        <h2>配装槽位</h2>
        <div class="head-right">
          <label class="inline-field">
            <span>槽位</span>
            <select id="slotCountSelect">
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
            </select>
          </label>
          <label class="inline-field">
            <span>全体染元素</span>
            <select id="imbueAllSelect">
              <option value="keep">不变</option>
              <option value="thunder">雷</option>
              <option value="ice">冰</option>
              <option value="poison">毒</option>
              <option value="none">清除</option>
            </select>
          </label>
          <span class="hint" id="buildSummary" title="点左边魂玉即佩戴；每颗玉 4 格词条，可单独染元素"></span>
        </div>
      </div>
      <div class="slots" id="slots"></div>
    </div>

    <!-- 右：抽屉（玉详情 / 参数） -->
    <div class="pane">
      <div class="pane-head">
        <h2>勾选词条 · 自动分析</h2>
        <span class="hint">不换玉 · 不增加稀有词条</span>
      </div>
      <div class="drawer-tabs" id="drawerTabs">
        <button class="drawer-tab active" data-drawer="analysis" type="button">勾选分析</button>
        <button class="drawer-tab" data-drawer="jade" type="button">魂玉说明</button>
        <button class="drawer-tab" data-drawer="param" type="button">计算参数</button>
        <button class="drawer-tab" data-drawer="cond" type="button">条件加成</button>
      </div>
      <div class="pane-body">
        <div class="drawer-body" id="drawerAnalysis"></div>
        <div class="drawer-body" id="drawerJade" style="display:none">
          <div class="nsjx-empty small">点中间某颗玉的标题，这里显示它的完整效果与词条说明。</div>
        </div>
        <div class="drawer-body" id="drawerParam" style="display:none">
          <div class="param-grid" id="paramGrid"></div>
        </div>
        <div class="drawer-body" id="drawerCond" style="display:none">
          <div id="condBlock" style="display:none">
            <div class="cond-list" id="condList"></div>
          </div>
          <div class="nsjx-empty small" id="condEmpty">当前配装没有条件加成。</div>
        </div>
      </div>
    </div>

  </section>

  <!-- ---------- 视图 ②：结果 ---------- -->
  <section class="view view-result" id="view-result">

    <!-- 左：总览 -->
    <div class="pane">
      <div class="pane-head">
        <h2>期望伤害</h2>
        <span class="hint" id="scoreSummary"></span>
      </div>
      <div class="result-hero">
        <div>
          <div class="meta">综合期望伤害 · 每秒</div>
          <div class="big"><span id="heroDps">—</span><small>/秒</small></div>
        </div>
        <div>
          <div class="meta">相对基准</div>
          <div class="idx" id="baselineValue">—</div>
        </div>
      </div>
      <div class="pane-body">
        <div class="stat-block">
          <h3 class="block-title">期望伤害明细</h3>
          <div class="dmg-table" id="dmgTable"></div>
        </div>
        <div class="stat-block">
          <h3 class="block-title">面板属性总览</h3>
          <div class="stat-grid" id="statGrid"></div>
        </div>
      </div>
    </div>

    <!-- 右：特殊效果 + 公式 -->
    <div class="pane">
      <div class="pane-head">
        <h2>机制 · 说明</h2>
        <span class="hint">未计入数值</span>
      </div>
      <div class="pane-body">
        <div class="stat-block" id="specialBlock">
          <h3 class="block-title">已激活特殊效果</h3>
          <ul class="special-list" id="specialList"></ul>
        </div>
        <details class="stat-block collapsible">
          <summary class="block-title">计算公式说明</summary>
          <div class="formula-note" id="formulaNote"></div>
        </details>
      </div>
    </div>

  </section>

  <!-- ---------- 视图 ③：对比 · 最优 ---------- -->
  <section class="view view-compare" id="view-compare">
    <div class="panel-wrap" id="extMount"></div>
  </section>

</main>

<!-- 隐藏的兼容节点：上游 JS 会写这些 id，保留但不可见 -->
<div id="dmgTotal" class="hidden-compat"></div>
<div id="panel-pool" style="display:none"></div>
<div id="panel-build" style="display:none"></div>
<div id="panel-stats" style="display:none"></div>
<div id="tabs" style="display:none"></div>
<div id="toast" class="toast"></div>

<script src="data.js"></script>
<script src="app.js"></script>
<!-- 二改扩展：单屏布局 / 历史快照 / 差异对比 / 自动最优 -->
<script src="ext/nsj-ext-core.js"></script>
<script src="ext/nsj-ext-store.js"></script>
<script src="ext/nsj-ext-optimizer.js"></script>
<script src="ext/nsj-ext-locked.js"></script>
<script src="ext/nsj-layout.js"></script>
<script src="ext/nsj-ext-ui.js"></script>
<script src="ext/nsj-auto-analysis.js"></script>
</body>
</html>
